name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  # The job name is the required check on main (ruleset): never rename it.
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Fail fast: lint takes seconds.
      - name: flake8
        run: pipx run flake8 src tests scripts

      # Only what the tests import. The full environment is environment.yml.
      - name: install test dependencies
        run: pip install pyyaml python-dotenv pytest pytest-cov

      - name: pytest
        run: pytest --cov=src --cov-report=term-missing

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csd"
version = "0.1.0"
description = "Credit spread decomposition and ML bond pricer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn",
    "xgboost",
    "shap",
    "matplotlib",
    "python-dotenv",
    "wrds",
]

[project.optional-dependencies]
# Pinned to the versions tested on the Spark Connect server (Spark 4.2.0, GraphFrames 0.12.3).
connect = ["pyspark[connect]==4.2.0", "graphframes-py==0.12.3"]
local = ["pyspark==4.2.0", "graphframes-py==0.12.3"]
dev = ["pytest", "ruff", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

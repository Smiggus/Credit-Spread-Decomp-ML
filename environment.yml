# environment.yml  [Dependencies]
# Create with: conda env create -f environment.yml
# Update with: conda env update -f environment.yml --prune
name: credit-spread-decomp
channels:
  - conda-forge
dependencies:
  - python=3.12
  # data and modelling
  - numpy
  - pandas<3  # PySpark 4.2 does not fully support pandas 3 yet
  - pyarrow
  - xgboost>=3.1  # 3.1 and later match categories by value at prediction time
  - scipy  # stage c: the Merton solver and the normal distribution
  - matplotlib
  - radon
  # settings
  - pyyaml
  - python-dotenv
  # quality
  - pytest
  - pytest-cov
  - flake8
  - pylint
  - isort
  # notebooks
  - jupyterlab
  - pip
  - pip:
      # Pinned to the versions tested on the Spark Connect server (Spark 4.2.0, GraphFrames 0.12.3).
      - pyspark[connect]==4.2.0
      - graphframes-py==0.12.3
      - wrds
